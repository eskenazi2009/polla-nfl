<title>Polla Panamá 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#eef1f4; --surface:#fbfcfd; --raised:#ffffff;
  --ink:#101a2b; --ink-2:#4a5566; --muted:#7a8595;
  --line:#dbe1e8; --line-2:#c7cfd9;
  --e1:#2a78d6; --e1-tint:rgba(42,120,214,.12);
  --e2:#eb6834; --e2-tint:rgba(235,104,52,.13);
  --won:#0ca30c; --won-ink:#006300; --won-tint:rgba(12,163,12,.13);
  --lost:#d03b3b; --lost-ink:#b02a2a; --lost-tint:rgba(208,59,59,.12);
  --push:#898781; --push-tint:rgba(137,135,129,.16);
  --live:#c98500; --live-tint:rgba(237,161,0,.15);
  --split:#4a3aa7;
  --bar-bg:#e4e8ee;
  --shadow:0 1px 2px rgba(16,26,43,.06),0 4px 16px rgba(16,26,43,.05);
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0b1018; --surface:#121925; --raised:#18212f;
    --ink:#edf1f6; --ink-2:#b4bfcd; --muted:#8793a4;
    --line:#233042; --line-2:#2f3e53;
    --e1:#3987e5; --e1-tint:rgba(57,135,229,.2);
    --e2:#d95926; --e2-tint:rgba(217,89,38,.22);
    --won-ink:#3fc43f; --won-tint:rgba(12,163,12,.2);
    --lost:#e05555; --lost-ink:#ef7a7a; --lost-tint:rgba(224,85,85,.2);
    --push-tint:rgba(137,135,129,.22);
    --live-tint:rgba(237,161,0,.2);
    --split:#9085e9;
    --bar-bg:#223044;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0b1018; --surface:#121925; --raised:#18212f;
  --ink:#edf1f6; --ink-2:#b4bfcd; --muted:#8793a4;
  --line:#233042; --line-2:#2f3e53;
  --e1:#3987e5; --e1-tint:rgba(57,135,229,.2);
  --e2:#d95926; --e2-tint:rgba(217,89,38,.22);
  --won-ink:#3fc43f; --won-tint:rgba(12,163,12,.2);
  --lost:#e05555; --lost-ink:#ef7a7a; --lost-tint:rgba(224,85,85,.2);
  --push-tint:rgba(137,135,129,.22);
  --live-tint:rgba(237,161,0,.2);
  --split:#9085e9;
  --bar-bg:#223044;
  --shadow:none;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font:15px/1.45 var(--body);padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:.01em}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font:600 12px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--e1);outline-offset:2px}

/* Header */
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;border-bottom:2px solid var(--ink);padding-bottom:14px}
header.top h1{font-size:clamp(34px,6vw,52px);font-weight:700;line-height:.95;text-transform:uppercase}
header.top .meta{display:flex;flex-direction:column;align-items:flex-end;gap:6px;text-align:right}
.updated{color:var(--ink-2);font-size:13px}
.lockchip{display:inline-flex;align-items:center;gap:8px;font:600 13px/1 var(--body);padding:7px 11px;border-radius:999px;background:var(--live-tint);color:var(--ink)}
.lockchip .dot{width:8px;height:8px;border-radius:50%;background:var(--live)}
.lockchip.locked{background:var(--bar-bg)}
.lockchip.locked .dot{background:var(--muted)}

/* Entry cards */
.entries{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.entry{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:18px 20px;display:grid;grid-template-columns:auto 1fr;gap:4px 20px;position:relative;overflow:hidden}
.entry::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--c)}
.entry .who{grid-column:1/-1;display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:6px}
.entry .who h2{font-size:26px;font-weight:700}
.entry .rank{font:700 64px/0.9 var(--display);color:var(--c)}
.entry .rank small{display:block;font:500 13px/1.3 var(--body);color:var(--muted);margin-top:6px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;align-content:start}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font:600 22px/1.1 var(--display)}
.stat .v.good{color:var(--won-ink)} .stat .v.bad{color:var(--lost-ink)}

/* Section */
section.block{display:flex;flex-direction:column;gap:14px}
.block-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 20px}
.block-head h2{font-size:30px;font-weight:700;text-transform:uppercase}
.sub{color:var(--ink-2);font-size:14px}

/* Controls */
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;background:var(--bar-bg);border-radius:8px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 11px;border-radius:6px;cursor:pointer;font-weight:600;font-size:13px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg button:hover:not([aria-pressed="true"]){color:var(--ink)}
.weekseg button{font-family:var(--display);font-size:15px;min-width:38px}

.weeksum{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:14px;color:var(--ink-2)}
.weeksum b{color:var(--ink);font-weight:600}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--c);margin-right:6px;vertical-align:0}

/* Board */
.board{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden}
.bhead,.game{display:grid;grid-template-columns:92px minmax(230px,1.5fr) 118px 118px minmax(150px,1fr);gap:14px;align-items:center;padding:10px 16px}
.bhead{font:600 11px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);padding-block:11px}
.bhead .e{display:flex;align-items:center}
.game{border-bottom:1px solid var(--line);position:relative}
.game:last-child{border-bottom:0}
.game.split::after{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 2px 2px 0;background:var(--split)}
.when{font-size:12px;color:var(--muted);line-height:1.25}
.when .st{display:block;font:600 12px/1.2 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.when .st.live{color:var(--live)}
.matchup{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:14px}
.team{display:flex;align-items:baseline;gap:8px;min-width:0}
.team .ab{font:700 18px/1.15 var(--display);min-width:40px}
.team .nm{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.team .sp{font:600 13px/1 var(--body);color:var(--muted);font-variant-numeric:tabular-nums}
.team.loser .ab,.team.loser + .sc{color:var(--muted)}
.sc{font:700 18px/1.15 var(--display);text-align:right;font-variant-numeric:tabular-nums}
.tbtag{font:600 10px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line-2);border-radius:4px;padding:3px 5px;margin-left:4px}

.pick{display:flex;align-items:center;gap:8px;border-radius:7px;padding:6px 9px;min-height:40px;background:var(--bar-bg);border:1px solid transparent}
.pick .t{font:700 18px/1 var(--display)}
.pick .s{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.pick .r{margin-left:auto;font:700 12px/1 var(--body);letter-spacing:.04em}
.pick.won{background:var(--won-tint)} .pick.won .r{color:var(--won-ink)}
.pick.lost{background:var(--lost-tint)} .pick.lost .r{color:var(--lost-ink)}
.pick.push{background:var(--push-tint)}
.pick.pending{background:transparent;border-color:var(--line-2)}
.pick.live-up{background:var(--won-tint);border-color:var(--live)} .pick.live-up .r{color:var(--won-ink)}
.pick.live-down{background:var(--lost-tint);border-color:var(--live)} .pick.live-down .r{color:var(--lost-ink)}
.pick.hidden{background:transparent;border:1px dashed var(--line-2);color:var(--muted);font-size:12px;line-height:1.2}
.pick.none{background:transparent;color:var(--muted)}
.mlabel{display:none}

.dist{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-2)}
.dist .bar{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px;background:var(--surface)}
.dist .bar i{display:block;height:100%;background:var(--line-2)}
.dist .bar i:first-child{border-radius:4px 0 0 4px} .dist .bar i:last-child{border-radius:0 4px 4px 0}
.dist .bar i.win{background:var(--won)}
.dist .lbl{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.dist .na{color:var(--muted);font-size:12px}
.empty{padding:28px 16px;color:var(--muted);text-align:center}

/* Charts */
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h3{font-size:21px;font-weight:700;text-transform:uppercase}
.card .note{font-size:13px;color:var(--ink-2)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--ink-2)}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--body);font-size:11px;fill:var(--muted)}
.chart .val{fill:var(--ink-2);font-weight:600}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{stroke:var(--line-2);stroke-width:1}
.tip{position:fixed;pointer-events:none;background:var(--raised);color:var(--ink);border:1px solid var(--line-2);border-radius:6px;padding:7px 10px;font-size:12px;box-shadow:0 6px 20px rgba(0,0,0,.18);z-index:10;max-width:240px}
.vs table{width:100%;border-collapse:collapse;font-size:14px}
.vs th{font:600 11px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
.vs th:first-child,.vs td:first-child{text-align:left}
.vs td{padding:9px 4px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.vs tr:last-child td{border-bottom:0}

/* Standings */
.tablewrap{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow-x:auto}
table.std{width:100%;border-collapse:collapse;font-size:14px;min-width:420px}
.std th{font:600 11px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:11px 14px;border-bottom:1px solid var(--line)}
.std td{padding:8px 14px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.std tr:last-child td{border-bottom:0}
.std .r{width:64px;color:var(--ink-2)}
.std .rt{text-align:right}
.std tr.part{cursor:pointer}
.std tr.part:hover td{background:var(--bar-bg)}
.std tr.me td{background:var(--c-tint);font-weight:600}
.std tr.me td:first-child{box-shadow:inset 4px 0 0 var(--c)}
.std tr.gap td{color:var(--muted);text-align:center;font-size:12px;padding:5px}
.std .caret{display:inline-block;width:1.1em;color:var(--muted);font-size:11px}
.std tr.part.open td{background:var(--bar-bg)}
.std .picksrow td{padding:0;background:var(--ground)}
.pl-rec{padding:10px 16px 2px;font:700 14px/1 var(--display);color:var(--ink-2);letter-spacing:.02em}
.pl{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:6px;padding:10px 16px 14px}
.pl .pk{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 9px;border-radius:6px;background:var(--surface);border:1px solid var(--line);font-size:12px}
.pl .pk .mt{color:var(--muted);font-variant-numeric:tabular-nums}
.pl .pk .at{margin:0 2px;opacity:.6}
.pl .pk .ch{font:700 15px/1 var(--display)}
.pl .pk .sp2{font:500 11px/1 var(--body);color:var(--muted);margin-left:4px}
.pl .pk.won{background:var(--won-tint);border-color:transparent} .pl .pk.won .ch{color:var(--won-ink)}
.pl .pk.lost{background:var(--lost-tint);border-color:transparent} .pl .pk.lost .ch{color:var(--lost-ink)}
.pl .pk.push{background:var(--push-tint);border-color:transparent}
.pl .pk.pending .ch{color:var(--ink)}
.pl .pk.wait{border-style:dashed} .pl .pk.wait .ch{color:var(--muted);font-size:12px}
.pl .pk.none .ch{color:var(--muted)}
.pl-empty{padding:14px 16px;color:var(--muted);font-size:13px}
/* Survivors */
.svcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.svhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.svhead h3{font:700 22px/1 var(--display);text-transform:uppercase}
.svhead .rule{font-size:12px;color:var(--muted)}
.svhead .rule b{color:var(--ink-2);font-weight:600}
.svtop{background:var(--bar-bg);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.svtop .lbl{font:600 11px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.svtop .lbl b{color:var(--ink-2)}
.svtop .row{display:flex;gap:8px;flex-wrap:wrap}
.svtop .fade{color:var(--muted);font-size:12px}
.topteam{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 10px}
.topteam .rk{font:700 11px/1 var(--display);color:var(--muted);width:14px}
.topteam .ab{font:700 16px/1 var(--display)}
.topteam .n{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.topteam .n b{color:var(--ink);font-weight:700}
.sventry{border-top:1px solid var(--line);padding-top:11px;display:flex;flex-direction:column;gap:8px}
.sventry:first-of-type{border-top:0;padding-top:0}
.sventry .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sventry .who2{font:600 14px/1 var(--body)}
.chip{display:inline-flex;align-items:center;gap:5px;font:600 11px/1 var(--body);padding:4px 8px;border-radius:999px}
.chip.alive{background:var(--won-tint);color:var(--won-ink)}
.chip.dead{background:var(--lost-tint);color:var(--lost-ink)}
.chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.svrec{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.svweeks{display:flex;gap:6px;flex-wrap:wrap}
.svw{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:44px;padding:6px 4px;border-radius:7px;background:var(--bar-bg);border:1px solid transparent}
.svw .wk{font:600 9px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.svw .tm{font:700 15px/1 var(--display)}
.svw .sc{font:500 10px/1 var(--body);color:var(--muted);font-variant-numeric:tabular-nums}
.svw.won{background:var(--won-tint)} .svw.won .tm{color:var(--won-ink)}
.svw.lost{background:var(--lost-tint)} .svw.lost .tm{color:var(--lost-ink)}
.svw.pending{background:transparent;border-color:var(--line-2)} .svw.pending .tm{color:var(--ink)}
.svw.missed{background:var(--lost-tint)} .svw.missed .tm{color:var(--lost-ink);font-size:11px}
.svw.dim{opacity:.5}
.linkbtn{border:1px solid var(--line-2);background:var(--raised);border-radius:7px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:13px}
.linkbtn:hover{border-color:var(--ink-2)}
footer{color:var(--muted);font-size:12px;border-top:1px solid var(--line);padding-top:14px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px}
footer a{color:var(--ink-2)}

@media (max-width:760px){
  .bhead{display:none}
  .game{grid-template-columns:1fr 1fr;gap:8px 10px;padding:12px 14px}
  .game .when{grid-column:1/-1;display:flex;gap:8px;align-items:baseline}
  .game .when .st{display:inline}
  .game .matchup{grid-column:1/-1}
  .game .dist{grid-column:1/-1}
  .mlabel{display:block;font-size:11px;color:var(--muted);margin-bottom:3px}
  .entry .rank{font-size:52px}
}
@media (prefers-reduced-motion:no-preference){
  .seg button{transition:background .15s,color .15s}
}
</style>

<script>
const DATA = /*__POLLA_DATA__*/null;
const TZ = 'America/Panama';
const ENTRIES = DATA.entries;
const ECOL = ['e1', 'e2'];
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const weekLabel = n => n.replace('Week', 'Semana');
const weekNum = n => n.split(' ').pop();
const fmt = (iso, opts) => new Intl.DateTimeFormat('es-PA', { timeZone: TZ, ...opts }).format(new Date(iso));
const fmtDay = iso => fmt(iso, { weekday: 'short', day: 'numeric', month: 'short' });
const fmtTime = iso => fmt(iso, { hour: 'numeric', minute: '2-digit' });
const spr = v => v == null ? '' : (v > 0 ? '+' + v : v === 0 ? 'PK' : String(v));
const pct = (a, b) => b ? Math.round(100 * a / b) + '%' : '–';
const now = Date.now();

function gameState(g) {
  if (g.st === 'finalized' || g.st === 'closed' || g.st === 'complete') return 'final';
  if (g.st === 'scheduled' || g.st === 'created') return new Date(g.at).getTime() > now ? 'sched' : 'live';
  return 'live';
}
function teamOf(g, ab) { return g.away.ab === ab ? [g.away, g.home] : [g.home, g.away]; }
function coverMargin(g, ab) { const [t, o] = teamOf(g, ab); return t.sc + t.sp - o.sc; }
function pickResult(g, p) {
  if (!p) return null;
  const st = gameState(g);
  if (p.g) return p.g === 'won' ? 'won' : p.g === 'lost' ? 'lost' : 'push';
  if (st === 'final') { const m = coverMargin(g, p.t); return m > 0 ? 'won' : m < 0 ? 'lost' : 'push'; }
  if (st === 'live') { const m = coverMargin(g, p.t); return m > 0 ? 'live-up' : m < 0 ? 'live-down' : 'live-even'; }
  return 'pending';
}
function record(games, who) {
  let w = 0, l = 0, p = 0, pend = 0;
  for (const g of games) {
    const r = pickResult(g, g.picks[who]);
    if (r === 'won') w++; else if (r === 'lost') l++; else if (r === 'push') p++; else pend++;
  }
  return { w, l, p, pend };
}
const recStr = r => `${r.w}-${r.l}${r.p ? '-' + r.p : ''}`;

/* Header */
const weeks = DATA.weeks;
const cur = weeks.find(w => w.current) || weeks[weeks.length - 1];
$('updated').textContent = 'Actualizado ' + fmt(DATA.fetchedAt, { weekday: 'long', day: 'numeric', month: 'long', hour: 'numeric', minute: '2-digit' });
(function lock() {
  const t = new Date(cur.lock).getTime();
  if (t > now) {
    const h = Math.round((t - now) / 36e5);
    $('locktext').textContent = `${weekLabel(cur.n)} · piques cierran ${fmtDay(cur.lock)} ${fmtTime(cur.lock)}` + (h < 48 ? ` (en ${h} h)` : '');
  } else {
    $('lockchip').classList.add('locked');
    $('locktext').textContent = `${weekLabel(cur.n)} · piques cerrados`;
  }
})();

/* Entry cards */
const std = DATA.standings;
const field = std.length;
const leader = std[0];
(function cards() {
  const html = ENTRIES.map((who, i) => {
    const s = std.find(x => x.h === who) || {};
    const wk = record(cur.games, who);
    return `<article class="entry" style="--c:var(--${ECOL[i]})">
      <div class="who"><h2>${esc(who)}</h2></div>
      <div class="rank num">${esc(s.dr || '–')}<small>de ${field} en la polla</small></div>
      <div class="stats">
        <div class="stat"><div class="k">Récord ATS</div><div class="v num">${s.w}-${s.l}${s.t ? '-' + s.t : ''}</div></div>
        <div class="stat"><div class="k">% acierto</div><div class="v num">${pct(s.w, s.w + s.l)}</div></div>
        <div class="stat"><div class="k">${weekLabel(cur.n)}</div><div class="v num">${recStr(wk)}${wk.pend ? ` <span style="font:500 13px var(--body);color:var(--muted)">· ${wk.pend} por jugar</span>` : ''}</div></div>
      </div>
    </article>`;
  }).join('');
  $('entries').innerHTML = html;
})();

/* Week board */
let selWeek = cur.n;
let filter = 'all';
try { const f = localStorage.getItem('polla-filter'); if (f) filter = f; } catch (e) {}

function renderWeekSeg() {
  $('weekseg').innerHTML = weeks.map(w =>
    `<button type="button" id="wk-${weekNum(w.n)}" data-w="${esc(w.n)}" aria-pressed="${w.n === selWeek}" title="${esc(weekLabel(w.n))}">S${weekNum(w.n)}</button>`).join('');
  document.querySelectorAll('#filterseg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.f === filter));
}
function pickCell(g, who, i) {
  const p = g.picks[who];
  const label = `<span class="mlabel"><span class="sw" style="--c:var(--${ECOL[i]})"></span>${esc(who)}</span>`;
  const locked = new Date(g.lockAt).getTime() <= now;
  if (!p) {
    if (!locked) return `<div>${label}<div class="pick hidden">Se ve al cerrar</div></div>`;
    return `<div>${label}<div class="pick none">Sin pique</div></div>`;
  }
  const r = pickResult(g, p);
  const [t] = teamOf(g, p.t);
  const rtxt = { won: 'GANÓ', lost: 'PERDIÓ', push: 'PUSH', 'live-up': 'CUBRE', 'live-down': 'NO CUBRE', 'live-even': 'EMPATE', pending: '' }[r];
  const cls = r === 'live-even' ? 'push' : r;
  return `<div>${label}<div class="pick ${cls}" style="box-shadow:inset 3px 0 0 var(--${ECOL[i]})"><span class="t">${esc(p.t)}</span><span class="s">${spr(t.sp)}</span><span class="r">${rtxt}</span></div></div>`;
}
function distCell(g) {
  if (!g.dist) return `<div class="dist"><span class="na">Distribución visible al cerrar</span></div>`;
  const a = g.dist[g.away.ab] || { pct: 0 }, h = g.dist[g.home.ab] || { pct: 0 };
  const st = gameState(g);
  let winAb = null;
  if (st === 'final') { const m = coverMargin(g, g.away.ab); winAb = m > 0 ? g.away.ab : m < 0 ? g.home.ab : null; }
  return `<div class="dist" title="${esc(g.away.ab)} ${a.pct}% (${a.n || 0}) · ${esc(g.home.ab)} ${h.pct}% (${h.n || 0})">
    <div class="lbl"><span>${esc(g.away.ab)} ${Math.round(a.pct)}%</span><span>${Math.round(h.pct)}% ${esc(g.home.ab)}</span></div>
    <div class="bar"><i class="${winAb === g.away.ab ? 'win' : ''}" style="width:${a.pct}%"></i><i class="${winAb === g.home.ab ? 'win' : ''}" style="width:${h.pct}%"></i></div>
  </div>`;
}
function teamRow(g, t, o, st) {
  const loser = st === 'final' && t.sc < o.sc;
  const showSc = st !== 'sched';
  return `<div class="team ${loser ? 'loser' : ''}"><span class="ab">${esc(t.ab)}</span><span class="nm">${esc(t.name)}</span><span class="sp">${spr(t.sp)}</span></div><div class="sc">${showSc ? t.sc : ''}</div>`;
}
function renderBoard() {
  const wk = weeks.find(w => w.n === selWeek);
  $('weektitle').textContent = weekLabel(wk.n);
  const games = wk.games;
  const isSplit = g => { const ps = ENTRIES.map(e => g.picks[e]?.t); return ps.every(Boolean) && new Set(ps).size > 1; };
  const same = games.filter(g => ENTRIES.every(e => g.picks[e]) && !isSplit(g)).length;
  const known = games.filter(g => ENTRIES.every(e => g.picks[e])).length;
  $('weeksum').innerHTML = ENTRIES.map((e, i) => { const r = record(games, e); return `<span><span class="sw" style="--c:var(--${ECOL[i]})"></span>${esc(e)} <b class="num">${recStr(r)}</b></span>`; }).join('') +
    `<span>Coinciden en <b class="num">${same}</b> de ${known}${known < games.length ? ` <span style="color:var(--muted)">(${games.length - known} aún ocultos)</span>` : ''}</span>`;
  let list = games;
  if (filter === 'same') list = games.filter(g => ENTRIES.every(e => g.picks[e]) && !isSplit(g));
  const head = `<div class="bhead"><span>Hora</span><span>Partido · spread</span>${ENTRIES.map((e, i) => `<span class="e"><span class="sw" style="--c:var(--${ECOL[i]})"></span>${esc(e)}</span>`).join('')}<span>Pique de la polla</span></div>`;
  if (!list.length) { $('board').innerHTML = head + `<div class="empty">${known < games.length ? 'Los piques de ambas cuentas se ven cuando cierra la semana.' : 'Las dos cuentas no coinciden en ningún partido de esta semana.'}</div>`; return; }
  $('board').innerHTML = head + list.map(g => {
    const st = gameState(g);
    const stTxt = st === 'final' ? 'Final' : st === 'live' ? 'En vivo' : fmtTime(g.at);
    return `<div class="game ${isSplit(g) ? 'split' : ''}">
      <div class="when"><span class="st ${st === 'live' ? 'live' : ''}">${stTxt}</span>${fmtDay(g.at)}</div>
      <div class="matchup">${teamRow(g, g.away, g.home, st)}${teamRow(g, g.home, g.away, st).replace('</span></div>', '</span>' + (g.tb ? '<span class="tbtag">Desempate</span>' : '') + '</div>')}</div>
      ${ENTRIES.map((e, i) => pickCell(g, e, i)).join('')}
      ${distCell(g)}
    </div>`;
  }).join('');
}
$('weekseg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; selWeek = b.dataset.w; renderWeekSeg(); renderBoard(); if (typeof renderStd === 'function') renderStd(); });
$('filterseg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; filter = b.dataset.f; try { localStorage.setItem('polla-filter', filter); } catch (err) {} renderWeekSeg(); renderBoard(); });
renderWeekSeg(); renderBoard();

/* Standings — cada participante se expande con sus piques de la semana seleccionada */
let showAll = false;
const open = new Set();

// Piques de un participante en la semana seleccionada: gameId -> alias.
function entryPicks(handle) {
  const ap = (DATA.allPicks || {})[selWeek];
  if (!ap || !ap.p || ap.p[handle] == null) return null;
  const aliases = ap.p[handle].split(',');
  const map = {};
  ap.gids.forEach((gid, i) => { if (aliases[i] && aliases[i] !== '-') map[gid] = aliases[i]; });
  return map;
}
function outcome(g, alias) {
  if (!alias) return 'none';
  if (gameState(g) !== 'final') return 'pending';
  const m = coverMargin(g, alias);
  return m > 0 ? 'won' : m < 0 ? 'lost' : 'push';
}
function picksPanel(handle) {
  const wk = weeks.find(w => w.n === selWeek);
  const map = entryPicks(handle);
  if (!map) {
    const locked = new Date(wk.lock).getTime() <= now;
    return `<div class="pl-empty">${locked ? 'No hay piques guardados de esta semana.' : 'Los piques de los demás se ven cuando cierra la semana (' + fmtDay(wk.lock) + ' ' + fmtTime(wk.lock) + ').'}</div>`;
  }
  let w = 0, l = 0, hidden = 0;
  const chips = wk.games.map(g => {
    const alias = map[g.id];
    const locked = new Date(g.lockAt).getTime() <= now;
    let r, inner;
    if (alias) {
      r = outcome(g, alias);
      if (r === 'won') w++; else if (r === 'lost') l++;
      const [t] = teamOf(g, alias);
      inner = `${esc(alias)}<span class="sp2">${spr(t.sp)}</span>`;
    } else if (!locked) { r = 'wait'; inner = '🔒'; hidden++; }
    else { r = 'none'; inner = '—'; }
    return `<div class="pk ${r}"><span class="mt">${esc(g.away.ab)}<span class="at">@</span>${esc(g.home.ab)}</span><span class="ch">${inner}</span></div>`;
  }).join('');
  const rec = `${w}-${l} ATS en ${weekLabel(wk.n)}` + (hidden ? ` · ${hidden} por revelarse` : '');
  return `<div class="pl-rec">${rec}</div><div class="pl">${chips}</div>`;
}
function renderStd() {
  $('stdweek').textContent = weekLabel(selWeek);
  const mineIdx = std.map((s, i) => s.me ? i : -1).filter(i => i >= 0);
  const keep = new Set();
  if (showAll) std.forEach((_, i) => keep.add(i));
  else {
    for (let i = 0; i < Math.min(10, std.length); i++) keep.add(i);
    mineIdx.forEach(i => { for (let j = i - 2; j <= i + 2; j++) if (j >= 0 && j < std.length) keep.add(j); });
  }
  let rows = '', prev = -1;
  std.forEach((s, i) => {
    if (!keep.has(i)) return;
    if (prev >= 0 && i - prev > 1) rows += `<tr class="gap"><td colspan="4">· · ·</td></tr>`;
    prev = i;
    const ei = ENTRIES.indexOf(s.h);
    const isOpen = open.has(s.h);
    rows += `<tr class="part ${s.me ? 'me' : ''} ${isOpen ? 'open' : ''}" data-h="${esc(s.h)}" ${ei >= 0 ? `style="--c:var(--${ECOL[ei]});--c-tint:var(--${ECOL[ei]}-tint)"` : ''}><td class="r">${esc(s.dr)}</td><td><span class="caret">${isOpen ? '▾' : '▸'}</span>${esc(s.h)}</td><td class="rt">${s.w}-${s.l}${s.t ? '-' + s.t : ''}</td><td class="rt">${pct(s.w, s.w + s.l)}</td></tr>`;
    if (isOpen) rows += `<tr class="picksrow"><td colspan="4">${picksPanel(s.h)}</td></tr>`;
  });
  $('std').innerHTML = `<thead><tr><th>Puesto</th><th>Participante</th><th class="rt">Récord</th><th class="rt">%</th></tr></thead><tbody>${rows}</tbody>`;
  $('stdtoggle').textContent = showAll ? 'Ver solo el resumen' : `Ver la tabla completa (${field})`;
}
$('std').addEventListener('click', e => { const tr = e.target.closest('tr.part'); if (!tr) return; const h = tr.dataset.h; if (open.has(h)) open.delete(h); else open.add(h); renderStd(); });
$('stdtoggle').addEventListener('click', () => { showAll = !showAll; renderStd(); });
renderStd();

/* Survivors */
(function survivors() {
  const svs = DATA.survivors || [];
  if (!svs.length) return;
  $('survblock').hidden = false;
  const weekNo = w => parseInt(w.split(' ').pop(), 10);
  const rule = m => m === 'pick_loser'
    ? 'Escoge un equipo que <b>pierda</b> cada semana, sin repetir.'
    : 'Escoge un equipo que <b>gane</b> cada semana, sin repetir.';
  const html = svs.map(sv => {
    const alive = sv.entries.filter(e => e.alive).length;
    const entries = [...sv.entries].sort((a, b) => (a.acct || '').localeCompare(b.acct || '') || a.order - b.order);
    const rows = entries.map(e => {
      const weeks = Object.keys(e.picks).sort((a, b) => weekNo(a) - weekNo(b));
      const cells = weeks.map(w => {
        const p = e.picks[w];
        let cls = 'pending', label = p.t || '—', sc = '';
        if (p.missed) { cls = 'missed'; label = 'Sin pick'; }
        else if (p.g === 'won') cls = 'won';
        else if (p.g === 'lost') cls = 'lost';
        if (p.st === 'finalized' && p.ts != null && (p.ts || p.os)) sc = `${p.ts}-${p.os}`;
        const dead = !e.alive && weekNo(w) > (e.elimWeek ? weekNo(e.elimWeek) : 99);
        const tip = `${w}${p.opp ? ' · ' + (p.t || '?') + ' vs ' + p.opp : ''}${sc ? ' (' + sc + ')' : ''}`;
        return `<div class="svw ${cls} ${dead ? 'dim' : ''}" title="${esc(tip)}"><span class="wk">S${weekNo(w)}</span><span class="tm">${esc(label)}</span><span class="sc">${esc(p.opp ? 'vs ' + p.opp : '')}</span></div>`;
      }).join('');
      const status = e.alive
        ? `<span class="chip alive"><span class="dot"></span>Vivo${e.lives > 1 ? ' · ' + e.lives + ' vidas' : ''}</span>`
        : `<span class="chip dead"><span class="dot"></span>Eliminado${e.elimWeek ? ' · Sem ' + weekNo(e.elimWeek) : ''}</span>`;
      return `<div class="sventry">
        <div class="top"><span class="who2">${esc(e.acct)} #${e.order}</span>${status}<span class="svrec">${weeks.length} sem</span></div>
        <div class="svweeks">${cells}</div>
      </div>`;
    }).join('');
    const verb = sv.pickMode === 'pick_loser' ? 'pierda' : 'gane';
    let top = '';
    if (sv.topPicks && sv.topPicks.teams && sv.topPicks.teams.length) {
      const tp = sv.topPicks;
      const chips = tp.teams.slice(0, 3).map((t, i) =>
        `<div class="topteam"><span class="rk">${i + 1}</span><span class="ab">${esc(t.ab)}</span><span class="n"><b>${t.n}</b> · ${t.pct}%</span></div>`).join('');
      top = `<div class="svtop">
        <div class="lbl">Más escogidos · <b>${esc(weekLabel(tp.week))}</b>${tp.settled ? '' : ' · se completa al cerrar'}</div>
        <div class="row">${chips}</div>
        <div class="fade">Reman en contra: escoge equipos distintos a estos para que un mal domingo no te tumbe con la mayoría.</div>
      </div>`;
    } else if (sv.entries.some(e => e.alive)) {
      top = `<div class="svtop"><div class="lbl">Más escogidos · ${esc(weekLabel(sv.curWeek || ''))}</div><div class="fade">Se revela cuando cierran los piques de la semana.</div></div>`;
    }
    return `<div class="svcard">
      <div class="svhead"><h3>${esc(sv.short)}</h3><span class="rule">${rule(sv.pickMode)}</span></div>
      <div class="sub">${esc(sv.name)} · <b>${alive}</b> de ${sv.entries.length} ${alive === 1 ? 'entrada viva' : 'entradas vivas'}</div>
      ${top}
      ${rows}
    </div>`;
  }).join('');
  $('survivors').innerHTML = html;
})();

$('foot').textContent = `Datos de Splash Sports · ${field} participantes · se actualiza automáticamente`;
</script>
